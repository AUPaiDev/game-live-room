<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播间插件 - 主播后台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

/* Header */
.header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #0f3460; }
.header h1 { font-size: 18px; color: #e94560; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; transition: background 0.3s; }
.status-dot.connected { background: #4caf50; }
.status-dot.error { background: #f44336; }
.status-label { font-size: 13px; color: #aaa; }
.online-count { margin-left: auto; font-size: 13px; color: #aaa; }

/* Layout */
.layout { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar { width: 180px; background: #16213e; border-right: 1px solid #0f3460; padding: 16px 0; }
.nav-item { padding: 12px 20px; cursor: pointer; font-size: 14px; color: #aaa; transition: all 0.2s; border-left: 3px solid transparent; }
.nav-item:hover { background: #0f3460; color: #e0e0e0; }
.nav-item.active { background: #0f3460; color: #e94560; border-left-color: #e94560; }

/* Main content */
.main { flex: 1; overflow-y: auto; padding: 20px; }
.panel { display: none; }
.panel.active { display: block; }
.panel-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #e94560; }

/* Cards */
.card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #ccc; }

/* Buttons */
.btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity 0.2s; }
.btn:hover { opacity: 0.85; }
.btn-primary { background: #e94560; color: #fff; }
.btn-success { background: #4caf50; color: #fff; }
.btn-danger { background: #f44336; color: #fff; }
.btn-secondary { background: #0f3460; color: #e0e0e0; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* Forms */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
.form-control { width: 100%; padding: 8px 10px; background: #0f3460; border: 1px solid #1a4a8a; border-radius: 6px; color: #e0e0e0; font-size: 13px; }
.form-control:focus { outline: none; border-color: #e94560; }
select.form-control option { background: #16213e; }

/* Tables */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; padding: 8px 10px; background: #0f3460; color: #aaa; font-weight: 500; }
.table td { padding: 8px 10px; border-bottom: 1px solid #0f3460; }
.table tr:hover td { background: rgba(255,255,255,0.03); }

/* Scoreboard */
.score-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #0f3460; }
.score-name { flex: 1; font-size: 14px; }
.score-bar-wrap { flex: 2; background: #0f3460; border-radius: 4px; height: 8px; overflow: hidden; }
.score-bar { height: 100%; background: #e94560; border-radius: 4px; transition: width 0.5s ease; }
.score-value { width: 60px; text-align: right; font-size: 14px; font-weight: 600; color: #e94560; }

/* Event feed */
.event-feed { height: 200px; overflow-y: auto; background: #0f3460; border-radius: 6px; padding: 8px; font-size: 12px; }
.event-item { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.event-item .cmd { color: #e94560; margin-right: 6px; }
.event-item .user { color: #4fc3f7; margin-right: 6px; }

/* Quiz timer */
.quiz-timer { font-size: 32px; font-weight: 700; color: #e94560; text-align: center; padding: 16px; }
.quiz-status { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 12px; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #16213e; border: 1px solid #0f3460; border-radius: 10px; padding: 24px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Textarea */
textarea.form-control { resize: vertical; min-height: 80px; }

/* Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
.tag-text { background: #0f3460; color: #aaa; }
.tag-image { background: #1a4a8a; color: #4fc3f7; }
.tag-audio { background: #2d1b4e; color: #ce93d8; }

.flex-row { display: flex; gap: 8px; align-items: center; }
.flex-1 { flex: 1; }

/* QR code login */
.qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; }
.qr-img { width: 200px; height: 200px; border: 2px solid #0f3460; border-radius: 8px; background: #fff; }
.qr-status { font-size: 13px; color: #aaa; }
.qr-status.success { color: #4caf50; }
.qr-status.expired { color: #f44336; }
.cookie-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #0f3460; }
.cookie-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0f3460; object-fit: cover; }
.cookie-info { flex: 1; }
.cookie-name { font-size: 13px; font-weight: 600; }
.cookie-meta { font-size: 11px; color: #aaa; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-left: 4px; }
.badge-active { background: #4caf50; color: #fff; }
.badge-inactive { background: #555; color: #ccc; }
</style>
</head>
<body>

<div class="header">
  <h1>直播间插件</h1>
  <div class="status-dot" id="statusDot"></div>
  <span class="status-label" id="statusLabel">未连接</span>
  <span class="online-count" id="onlineCount">在线: 0</span>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="nav-item active" data-panel="gift">礼物触发</div>
    <div class="nav-item" data-panel="sc">SC 触发</div>
    <div class="nav-item" data-panel="quiz">答题游戏</div>
    <div class="nav-item" data-panel="vote">礼物投票</div>
    <div class="nav-item" data-panel="auth">B站账号</div>
  </div>

  <div class="main">
    <!-- Gift Panel -->
    <div class="panel active" id="panel-gift">
      <div class="panel-title">礼物触发</div>
      <div class="card">
        <div class="card-title">触发规则</div>
        <table class="table" id="giftRulesTable">
          <thead><tr><th>礼物名</th><th>动作</th><th>操作</th></tr></thead>
          <tbody id="giftRulesBody"></tbody>
        </table>
        <div style="margin-top:12px">
          <div class="flex-row">
            <input class="form-control flex-1" id="giftRuleName" placeholder="礼物名">
            <input class="form-control flex-1" id="giftRuleAction" placeholder="动作 (如: play_animation)">
            <button class="btn btn-primary btn-sm" onclick="addGiftRule()">添加</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">手动触发</div>
        <div class="flex-row">
          <input class="form-control flex-1" id="manualGiftName" placeholder="礼物名">
          <button class="btn btn-secondary" onclick="manualTriggerGift()">触发</button>
        </div>
      </div>
    </div>

    <!-- SC Panel -->
    <div class="panel" id="panel-sc">
      <div class="panel-title">SC 触发</div>
      <div class="card">
        <div class="card-title">金额阈值</div>
        <div class="flex-row">
          <label style="color:#aaa;font-size:13px">最低金额（元）：</label>
          <input class="form-control" id="scMinPrice" type="number" value="30" style="width:100px">
          <button class="btn btn-primary btn-sm" onclick="saveScConfig()">保存</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">最近 SC</div>
        <div id="scList" style="font-size:13px;color:#aaa">暂无数据</div>
      </div>
    </div>

    <!-- Quiz Panel -->
    <div class="panel" id="panel-quiz">
      <div class="panel-title">答题游戏</div>
      <div class="card">
        <div class="card-title">当前状态</div>
        <div class="quiz-status" id="quizStatus">未开始</div>
        <div class="quiz-timer" id="quizTimer" style="display:none">30</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-success" id="btnStartQuiz" onclick="openStartQuizModal()">开始答题</button>
          <button class="btn btn-danger" id="btnStopQuiz" onclick="stopQuiz()" style="display:none">强制结束</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
          题库管理
          <button class="btn btn-primary btn-sm" onclick="openQuestionModal(null)">新增题目</button>
        </div>
        <table class="table">
          <thead><tr><th>ID</th><th>类型</th><th>题目</th><th>操作</th></tr></thead>
          <tbody id="questionListBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Vote Panel -->
    <div class="panel" id="panel-vote">
      <div class="panel-title">礼物投票</div>
      <div class="card">
        <div class="card-title">控制</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-success" id="btnStartVote" onclick="startVote()">开始投票</button>
          <button class="btn btn-danger" id="btnStopVote" onclick="stopVote()" style="display:none">停止投票</button>
          <button class="btn btn-secondary" onclick="resetVote()">重置分数</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">实时计分板</div>
        <div id="scoreboardList"></div>
      </div>
    </div>

    <!-- Auth Panel -->
    <div class="panel" id="panel-auth">
      <div class="panel-title">B站账号</div>
      <div class="card">
        <div class="card-title">扫码登录</div>
        <div class="qr-wrap">
          <canvas id="qrCanvas" class="qr-img" width="200" height="200"></canvas>
          <div class="qr-status" id="qrStatus">点击下方按钮生成二维码</div>
          <button class="btn btn-primary" id="btnGenQR" onclick="generateQR()">生成二维码</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
          已保存账号
          <button class="btn btn-secondary btn-sm" onclick="loadCookies()">刷新</button>
        </div>
        <div id="cookieList"><div style="color:#aaa;font-size:13px">暂无账号</div></div>
      </div>
    </div>

    <!-- Event Feed (always visible at bottom) -->
    <div class="card" style="margin-top:8px">
      <div class="card-title">实时弹幕/礼物流</div>
      <div class="event-feed" id="eventFeed"></div>
    </div>
  </div>
</div>

<!-- Start Quiz Modal -->
<div class="modal-overlay" id="startQuizModal">
  <div class="modal">
    <div class="modal-title">选择题目</div>
    <div class="form-group">
      <label>题目</label>
      <select class="form-control" id="quizQuestionSelect"></select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('startQuizModal')">取消</button>
      <button class="btn btn-primary" onclick="startQuiz()">开始</button>
    </div>
  </div>
</div>

<!-- Question Edit Modal -->
<div class="modal-overlay" id="questionModal">
  <div class="modal">
    <div class="modal-title" id="questionModalTitle">新增题目</div>
    <input type="hidden" id="questionId">
    <div class="form-group">
      <label>类型</label>
      <select class="form-control" id="questionType">
        <option value="text">文字题</option>
        <option value="image">图片题</option>
        <option value="audio">音频题</option>
      </select>
    </div>
    <div class="form-group">
      <label>题目内容</label>
      <textarea class="form-control" id="questionText" placeholder="输入题目..."></textarea>
    </div>
    <div class="form-group">
      <label>选项（每行一个，共4个）</label>
      <textarea class="form-control" id="questionOptions" placeholder="选项A&#10;选项B&#10;选项C&#10;选项D"></textarea>
    </div>
    <div class="form-group">
      <label>正确答案（0=A, 1=B, 2=C, 3=D）</label>
      <input class="form-control" id="questionAnswer" type="number" min="0" max="3" value="0">
    </div>
    <div class="form-group">
      <label>媒体路径（图片/音频，可选）</label>
      <input class="form-control" id="questionMedia" placeholder="/media/image.jpg">
    </div>
    <div class="form-group">
      <label>解析（可选）</label>
      <textarea class="form-control" id="questionExplanation" placeholder="答案解析..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('questionModal')">取消</button>
      <button class="btn btn-primary" onclick="saveQuestion()">保存</button>
    </div>
  </div>
</div>

<script>
// ---- WebSocket ----
let ws = null;
let wsReconnectTimer = null;
let quizTimerInterval = null;
let quizTimeLeft = 0;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?type=admin`);

  ws.onopen = () => {
    setStatus('connected', '已连接');
    clearTimeout(wsReconnectTimer);
  };

  ws.onclose = () => {
    setStatus('', '已断开');
    wsReconnectTimer = setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    setStatus('error', '连接错误');
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch (_) {}
  };
}

function setStatus(cls, label) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (cls ? ' ' + cls : '');
  document.getElementById('statusLabel').textContent = label;
}

function handleMessage(msg) {
  if (msg.type === 'live_event') {
    appendEvent(msg.payload);
    if (msg.payload && msg.payload.cmd === 'SUPER_CHAT_MESSAGE') {
      appendSC(msg.payload);
    }
  } else if (msg.type === 'game_state') {
    const p = msg.payload;
    if (p && p.game === 'vote') updateScoreboard(p.state);
    if (p && p.game === 'quiz') onQuizStarted(p.state);
    if (p && p.game === 'quiz_result') onQuizResult(p.state);
  }
}

// ---- Navigation ----
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('panel-' + item.dataset.panel).classList.add('active');
    if (item.dataset.panel === 'auth') loadCookies();
  });
});

// ---- Event Feed ----
function appendEvent(payload) {
  const feed = document.getElementById('eventFeed');
  const item = document.createElement('div');
  item.className = 'event-item';
  const cmd = payload.cmd || payload.Cmd || '';
  const user = payload.username || payload.Username || '';
  const text = payload.text || payload.Text || payload.gift_name || payload.GiftName || '';
  item.innerHTML = `<span class="cmd">${cmd}</span><span class="user">${user}</span>${text}`;
  feed.insertBefore(item, feed.firstChild);
  if (feed.children.length > 100) feed.removeChild(feed.lastChild);
}

// ---- SC ----
const scItems = [];
function appendSC(payload) {
  scItems.unshift(payload);
  renderSCList();
}
function renderSCList() {
  const el = document.getElementById('scList');
  if (scItems.length === 0) { el.textContent = '暂无数据'; return; }
  el.innerHTML = scItems.slice(0, 10).map(s =>
    `<div style="padding:6px 0;border-bottom:1px solid #0f3460">
      <span style="color:#e94560;font-weight:600">¥${s.price || s.Price}</span>
      <span style="color:#4fc3f7;margin:0 8px">${s.username || s.Username}</span>
      <span>${s.text || s.Text}</span>
    </div>`
  ).join('');
}

// ---- Gift Rules ----
const giftRules = [];
function renderGiftRules() {
  const tbody = document.getElementById('giftRulesBody');
  tbody.innerHTML = giftRules.map((r, i) =>
    `<tr><td>${r.gift_name}</td><td>${r.action}</td>
     <td><button class="btn btn-danger btn-sm" onclick="removeGiftRule(${i})">删除</button></td></tr>`
  ).join('');
}
function addGiftRule() {
  const name = document.getElementById('giftRuleName').value.trim();
  const action = document.getElementById('giftRuleAction').value.trim();
  if (!name || !action) return;
  giftRules.push({ gift_name: name, action });
  renderGiftRules();
  document.getElementById('giftRuleName').value = '';
  document.getElementById('giftRuleAction').value = '';
}
function removeGiftRule(i) {
  giftRules.splice(i, 1);
  renderGiftRules();
}
function manualTriggerGift() {
  const name = document.getElementById('manualGiftName').value.trim();
  if (!name) return;
  sendCmd('trigger_gift', { gift_name: name });
}
function saveScConfig() {
  const price = parseInt(document.getElementById('scMinPrice').value);
  sendCmd('set_sc_min_price', { min_price: price });
}

// ---- Quiz ----
let questions = [];
function loadQuestions() {
  fetch('/api/quiz/questions').then(r => r.json()).then(data => {
    questions = data || [];
    renderQuestionList();
    renderQuizSelect();
  });
}
function renderQuestionList() {
  const tbody = document.getElementById('questionListBody');
  tbody.innerHTML = (questions || []).map(q => {
    const typeTag = `<span class="tag tag-${q.Type || q.type}">${q.Type || q.type}</span>`;
    const text = (q.Question || q.question || '').substring(0, 30);
    return `<tr>
      <td>${q.ID || q.id}</td>
      <td>${typeTag}</td>
      <td>${text}${text.length >= 30 ? '...' : ''}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="openQuestionModal(${q.ID || q.id})">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteQuestion(${q.ID || q.id})">删除</button>
        <button class="btn btn-primary btn-sm" onclick="startQuizWith(${q.ID || q.id})">出题</button>
      </td>
    </tr>`;
  }).join('');
}
function renderQuizSelect() {
  const sel = document.getElementById('quizQuestionSelect');
  sel.innerHTML = (questions || []).map(q =>
    `<option value="${q.ID || q.id}">[${q.Type || q.type}] ${(q.Question || q.question || '').substring(0, 40)}</option>`
  ).join('');
}
function openStartQuizModal() {
  loadQuestions();
  openModal('startQuizModal');
}
function startQuiz() {
  const sel = document.getElementById('quizQuestionSelect');
  const id = parseInt(sel.value);
  if (!id) return;
  fetch('/api/game/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ game: 'quiz', params: { question_id: id } })
  }).then(() => closeModal('startQuizModal'));
}
function startQuizWith(id) {
  fetch('/api/game/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ game: 'quiz', params: { question_id: id } })
  });
}
function stopQuiz() {
  fetch('/api/game/stop', { method: 'POST' });
}
function onQuizStarted(state) {
  document.getElementById('quizStatus').textContent = `答题中: ${(state.question || '').substring(0, 30)}`;
  document.getElementById('btnStartQuiz').style.display = 'none';
  document.getElementById('btnStopQuiz').style.display = '';
  startQuizCountdown(state.timeout || 30);
}
function onQuizResult(state) {
  clearInterval(quizTimerInterval);
  document.getElementById('quizTimer').style.display = 'none';
  document.getElementById('quizStatus').textContent =
    `结果: 共${state.total_answers}人答题，正确${state.correct_count}人 (${(state.correct_ratio * 100).toFixed(1)}%)`;
  document.getElementById('btnStartQuiz').style.display = '';
  document.getElementById('btnStopQuiz').style.display = 'none';
}
function startQuizCountdown(seconds) {
  quizTimeLeft = seconds;
  const el = document.getElementById('quizTimer');
  el.style.display = '';
  el.textContent = quizTimeLeft;
  clearInterval(quizTimerInterval);
  quizTimerInterval = setInterval(() => {
    quizTimeLeft--;
    el.textContent = quizTimeLeft;
    if (quizTimeLeft <= 0) clearInterval(quizTimerInterval);
  }, 1000);
}
function openQuestionModal(id) {
  document.getElementById('questionModalTitle').textContent = id ? '编辑题目' : '新增题目';
  document.getElementById('questionId').value = id || '';
  if (id) {
    const q = questions.find(x => (x.ID || x.id) == id);
    if (q) {
      document.getElementById('questionType').value = q.Type || q.type || 'text';
      document.getElementById('questionText').value = q.Question || q.question || '';
      let opts = [];
      try { opts = JSON.parse(q.Options || q.options || '[]'); } catch (_) {}
      document.getElementById('questionOptions').value = opts.join('\n');
      document.getElementById('questionAnswer').value = q.Answer !== undefined ? q.Answer : (q.answer || 0);
      document.getElementById('questionMedia').value = q.MediaPath || q.media_path || '';
      document.getElementById('questionExplanation').value = q.Explanation || q.explanation || '';
    }
  } else {
    document.getElementById('questionType').value = 'text';
    document.getElementById('questionText').value = '';
    document.getElementById('questionOptions').value = '';
    document.getElementById('questionAnswer').value = '0';
    document.getElementById('questionMedia').value = '';
    document.getElementById('questionExplanation').value = '';
  }
  openModal('questionModal');
}
function saveQuestion() {
  const id = document.getElementById('questionId').value;
  const opts = document.getElementById('questionOptions').value.split('\n').map(s => s.trim()).filter(Boolean);
  const body = {
    Type: document.getElementById('questionType').value,
    Question: document.getElementById('questionText').value,
    Options: JSON.stringify(opts),
    Answer: parseInt(document.getElementById('questionAnswer').value),
    MediaPath: document.getElementById('questionMedia').value,
    Explanation: document.getElementById('questionExplanation').value,
  };
  const url = id ? `/api/quiz/questions/${id}` : '/api/quiz/questions';
  const method = id ? 'PUT' : 'POST';
  fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(() => { closeModal('questionModal'); loadQuestions(); });
}
function deleteQuestion(id) {
  if (!confirm('确认删除？')) return;
  fetch(`/api/quiz/questions/${id}`, { method: 'DELETE' }).then(() => loadQuestions());
}

// ---- Vote ----
let voteActive = false;
function startVote() {
  fetch('/api/game/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ game: 'vote', params: {} })
  }).then(() => {
    voteActive = true;
    document.getElementById('btnStartVote').style.display = 'none';
    document.getElementById('btnStopVote').style.display = '';
  });
}
function stopVote() {
  fetch('/api/game/stop', { method: 'POST' }).then(() => {
    voteActive = false;
    document.getElementById('btnStartVote').style.display = '';
    document.getElementById('btnStopVote').style.display = 'none';
  });
}
function resetVote() {
  fetch('/api/vote/reset', { method: 'POST' });
}
function updateScoreboard(state) {
  if (!state) return;
  const el = document.getElementById('scoreboardList');
  const scores = state.scores || {};
  const slots = state.slots || [];
  const maxScore = Math.max(1, ...Object.values(scores));
  el.innerHTML = slots.map(slot => {
    const score = scores[slot.id] || 0;
    const pct = Math.round((score / maxScore) * 100);
    return `<div class="score-row">
      <div class="score-name">${slot.name}<br><small style="color:#aaa">${slot.gift_name}</small></div>
      <div class="score-bar-wrap"><div class="score-bar" style="width:${pct}%"></div></div>
      <div class="score-value">${score}</div>
    </div>`;
  }).join('');
}

// ---- Auth / QR Login ----
let qrPollTimer = null;
let currentQRKey = null;

function generateQR() {
  clearQRPoll();
  document.getElementById('qrStatus').textContent = '生成中...';
  document.getElementById('qrStatus').className = 'qr-status';
  fetch('/api/auth/qrcode/generate').then(r => r.json()).then(data => {
    if (!data.url) { setQRStatus('生成失败', ''); return; }
    currentQRKey = data.qrcode_key;
    drawQR(data.url);
    setQRStatus('请用B站APP扫码', '');
    qrPollTimer = setInterval(pollQR, 2000);
  }).catch(() => setQRStatus('网络错误', ''));
}

function pollQR() {
  if (!currentQRKey) return;
  fetch(`/api/auth/qrcode/poll?qrcode_key=${encodeURIComponent(currentQRKey)}`)
    .then(r => r.json()).then(data => {
      if (data.status === 86101) {
        setQRStatus('等待扫码...', '');
      } else if (data.status === 86090) {
        setQRStatus('已扫码，请在APP确认', '');
      } else if (data.status === 86038) {
        clearQRPoll();
        setQRStatus('二维码已过期，请重新生成', 'expired');
      } else if (data.status === 0) {
        clearQRPoll();
        setQRStatus('登录成功！', 'success');
        clearCanvas();
        loadCookies();
      }
    });
}

function clearQRPoll() {
  if (qrPollTimer) { clearInterval(qrPollTimer); qrPollTimer = null; }
  currentQRKey = null;
}

function setQRStatus(text, cls) {
  const el = document.getElementById('qrStatus');
  el.textContent = text;
  el.className = 'qr-status' + (cls ? ' ' + cls : '');
}

function clearCanvas() {
  const canvas = document.getElementById('qrCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// Minimal QR code renderer using the qrcode-generator library loaded inline.
// We use a simple fetch-to-img approach via a data URL from the B站 QR URL.
function drawQR(url) {
  // Use Google Charts QR API as a fallback renderer (no external JS needed).
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  };
  img.onerror = () => {
    // Fallback: show the URL as text
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#333';
    ctx.font = '10px monospace';
    ctx.fillText('扫码URL已生成', 10, 100);
  };
  img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
}

function loadCookies() {
  fetch('/api/auth/cookies').then(r => r.json()).then(data => {
    const el = document.getElementById('cookieList');
    if (!data || data.length === 0) {
      el.innerHTML = '<div style="color:#aaa;font-size:13px">暂无账号</div>';
      return;
    }
    el.innerHTML = data.map(c => {
      const active = c.IsActive ? '<span class="badge badge-active">使用中</span>' : '<span class="badge badge-inactive">未激活</span>';
      const valid = c.IsValid ? '' : '<span class="badge badge-inactive">已失效</span>';
      const face = c.Face ? `<img class="cookie-avatar" src="${c.Face}" onerror="this.style.display='none'">` : '<div class="cookie-avatar"></div>';
      return `<div class="cookie-row">
        ${face}
        <div class="cookie-info">
          <div class="cookie-name">${c.Label || c.DedeUserID}${active}${valid}</div>
          <div class="cookie-meta">UID: ${c.DedeUserID}</div>
        </div>
        <button class="btn btn-danger btn-sm" onclick="deleteCookie(${c.ID})">删除</button>
      </div>`;
    }).join('');
  });
}

function deleteCookie(id) {
  if (!confirm('确认删除该账号？')) return;
  fetch(`/api/auth/cookies/${id}`, { method: 'DELETE' }).then(() => loadCookies());
}

// ---- Helpers ----
function sendCmd(action, params) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'cmd', payload: { action, params } }));
  }
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ---- Init ----
connectWS();
loadQuestions();
fetch('/api/events?limit=50').then(r => r.json()).then(events => {
  (events || []).reverse().forEach(e => appendEvent({
    cmd: e.Cmd, username: e.Username, text: e.Text || e.GiftName
  }));
});
