<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #00f5ff;
  --pink: #ff2d78;
  --gold: #ffd700;
  --green: #39ff14;
  --bg-card: rgba(5,8,16,0.88);
  --border-cyan: rgba(0,245,255,0.35);
  --border-pink: rgba(255,45,120,0.35);
  --border-gold: rgba(255,215,0,0.5);
  --glow-cyan: 0 0 12px rgba(0,245,255,0.4), 0 0 30px rgba(0,245,255,0.1);
  --glow-pink: 0 0 12px rgba(255,45,120,0.4), 0 0 30px rgba(255,45,120,0.1);
  --glow-gold: 0 0 12px rgba(255,215,0,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1920px; height: 1080px;
  background: transparent;
  overflow: hidden;
  font-family: 'Noto Sans SC', sans-serif;
}

/* All modules: absolute positioned, hidden by default */
.module {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.module.visible {
  opacity: 1;
  pointer-events: auto;
}

/* ---- GIFT ALERT (top-right) ---- */
#gift-alert {
  top: 36px; right: 36px;
  width: 380px;
  transform: translateX(24px);
}
#gift-alert.visible { transform: translateX(0); }

.gift-card {
  background: var(--bg-card);
  border: 1px solid var(--border-pink);
  border-left: 3px solid var(--pink);
  border-radius: 6px;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  backdrop-filter: blur(10px);
  box-shadow: var(--glow-pink), inset 0 0 30px rgba(255,45,120,0.04);
  position: relative; overflow: hidden;
}
.gift-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--pink), transparent);
  opacity: 0.6;
}
.gift-icon { font-size: 28px; flex-shrink: 0; }
.gift-info { flex: 1; min-width: 0; }
.gift-user {
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px; font-weight: 700;
  color: #fff; letter-spacing: 0.5px;
}
.gift-text { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }
.gift-price {
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px; color: var(--gold);
  text-shadow: var(--glow-gold);
  flex-shrink: 0;
}

/* ---- SC ALERT (top-right, below gift) ---- */
#sc-alert {
  top: 130px; right: 36px;
  width: 400px;
  transform: translateX(24px);
}
#sc-alert.visible { transform: translateX(0); }

.sc-card {
  background: var(--bg-card);
  border: 1px solid var(--border-gold);
  border-left: 3px solid var(--gold);
  border-radius: 6px;
  padding: 14px 16px;
  backdrop-filter: blur(10px);
  box-shadow: var(--glow-gold), inset 0 0 30px rgba(255,215,0,0.04);
  position: relative; overflow: hidden;
}
.sc-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.6;
}
.sc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.sc-price {
  background: var(--gold);
  color: #050810;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px; font-weight: 700;
  padding: 2px 10px; border-radius: 2px;
  letter-spacing: 0.5px;
}
.sc-user {
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px; font-weight: 700;
  color: var(--gold);
}
.sc-text { font-size: 13px; color: rgba(255,255,255,0.9); line-height: 1.5; }

/* ---- SCOREBOARD (right side) ---- */
#scoreboard {
  top: 240px; right: 36px;
  width: 300px;
  transform: translateX(24px);
}
#scoreboard.visible { transform: translateX(0); }

.scoreboard-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border-cyan);
  border-radius: 6px;
  padding: 14px 16px;
  backdrop-filter: blur(10px);
  box-shadow: var(--glow-cyan);
  position: relative; overflow: hidden;
}
.scoreboard-wrap::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.5;
}
.scoreboard-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 12px; font-weight: 700;
  color: var(--cyan);
  text-align: center; margin-bottom: 12px;
  letter-spacing: 3px; text-transform: uppercase;
  text-shadow: 0 0 8px rgba(0,245,255,0.5);
}
.sb-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.sb-rank {
  width: 18px; text-align: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: rgba(255,255,255,0.4);
}
.sb-name { flex: 1; font-size: 13px; color: rgba(255,255,255,0.85); }
.sb-bar-wrap { width: 70px; background: rgba(255,255,255,0.08); border-radius: 2px; height: 4px; }
.sb-bar { height: 100%; background: var(--cyan); border-radius: 2px; transition: width 0.6s ease; box-shadow: 0 0 6px var(--cyan); }
.sb-score {
  width: 36px; text-align: right;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px; color: var(--cyan);
}

/* ---- QUIZ DISPLAY (center) ---- */
#quiz-display {
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.96);
  width: 720px;
}
#quiz-display.visible { transform: translate(-50%, -50%) scale(1); }

.quiz-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border-cyan);
  border-radius: 8px;
  padding: 28px 32px;
  backdrop-filter: blur(14px);
  box-shadow: var(--glow-cyan), 0 20px 60px rgba(0,0,0,0.7);
  position: relative; overflow: hidden;
}
.quiz-wrap::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}
.quiz-wrap::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,245,255,0.3), transparent);
}
.quiz-question {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 20px; font-weight: 700; color: #fff;
  line-height: 1.5; margin-bottom: 20px; text-align: center;
  text-shadow: 0 0 20px rgba(0,245,255,0.2);
}
.quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.quiz-option {
  background: rgba(0,245,255,0.04);
  border: 1px solid rgba(0,245,255,0.2);
  border-radius: 5px;
  padding: 11px 14px;
  font-size: 14px; color: rgba(255,255,255,0.85);
  display: flex; align-items: center; gap: 10px;
  transition: border-color 0.2s;
}
.quiz-option-label {
  width: 26px; height: 26px; border-radius: 3px;
  background: var(--cyan); color: #050810;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.quiz-timer-bar-wrap {
  background: rgba(255,255,255,0.08);
  border-radius: 3px; height: 6px; overflow: hidden;
}
.quiz-timer-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--pink));
  border-radius: 3px;
  transition: width 1s linear;
  box-shadow: 0 0 8px rgba(0,245,255,0.5);
}
.quiz-timer-text {
  text-align: right;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px; color: rgba(255,255,255,0.4);
  margin-top: 5px;
}

/* ---- QUIZ RESULT (center) ---- */
#quiz-result {
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.96);
  width: 620px;
}
#quiz-result.visible { transform: translate(-50%, -50%) scale(1); }

.result-wrap {
  background: var(--bg-card);
  border: 1px solid rgba(57,255,20,0.3);
  border-radius: 8px;
  padding: 28px 32px;
  backdrop-filter: blur(14px);
  box-shadow: 0 0 20px rgba(57,255,20,0.15), 0 20px 60px rgba(0,0,0,0.7);
  text-align: center;
  position: relative; overflow: hidden;
}
.result-wrap::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
}
.result-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px; font-weight: 700;
  color: var(--green); letter-spacing: 3px;
  text-transform: uppercase; margin-bottom: 14px;
  text-shadow: 0 0 10px rgba(57,255,20,0.5);
}
.result-answer {
  font-size: 15px; color: #fff; margin-bottom: 14px;
  background: rgba(57,255,20,0.08);
  border: 1px solid rgba(57,255,20,0.2);
  border-radius: 5px; padding: 10px 14px;
}
.result-stats { display: flex; gap: 28px; justify-content: center; margin-top: 14px; }
.result-stat { text-align: center; }
.result-stat-value {
  font-family: 'Rajdhani', sans-serif;
  font-size: 32px; font-weight: 700;
  color: var(--cyan);
  text-shadow: 0 0 12px rgba(0,245,255,0.5);
}
.result-stat-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: rgba(255,255,255,0.4);
  margin-top: 2px; letter-spacing: 1px;
}
.result-explanation {
  font-size: 12px; color: rgba(255,255,255,0.5);
  margin-top: 14px; line-height: 1.6;
}

/* ---- DANMAKU WALL (bottom-left) ---- */
#danmaku-wall {
  bottom: 36px; left: 36px;
  width: 340px; height: 380px;
  overflow: hidden;
}

.danmaku-list {
  display: flex; flex-direction: column-reverse;
  height: 100%; overflow: hidden;
}
.danmaku-item {
  background: rgba(5,8,16,0.72);
  border-left: 2px solid rgba(0,245,255,0.3);
  border-radius: 0 16px 16px 0;
  padding: 5px 12px;
  margin-top: 5px;
  font-size: 13px; color: rgba(255,255,255,0.85);
  backdrop-filter: blur(6px);
  animation: slideIn 0.25s ease;
  flex-shrink: 0;
}
.danmaku-item .dm-user {
  font-family: 'Rajdhani', sans-serif;
  color: var(--cyan); font-weight: 600;
  margin-right: 6px; font-size: 13px;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
</style>
</head>
<body>

<!-- Gift Alert -->
<div class="module" id="gift-alert">
  <div class="gift-card">
    <div class="gift-icon" id="giftIcon">🎁</div>
    <div class="gift-info">
      <div class="gift-user" id="giftUser"></div>
      <div class="gift-text" id="giftText"></div>
    </div>
    <div class="gift-price" id="giftPrice"></div>
  </div>
</div>

<!-- SC Alert -->
<div class="module" id="sc-alert">
  <div class="sc-card">
    <div class="sc-header">
      <span class="sc-price" id="scPrice"></span>
      <span class="sc-user" id="scUser"></span>
    </div>
    <div class="sc-text" id="scText"></div>
  </div>
</div>

<!-- Scoreboard -->
<div class="module" id="scoreboard">
  <div class="scoreboard-wrap">
    <div class="scoreboard-title">礼物投票</div>
    <div id="scoreboardRows"></div>
  </div>
</div>

<!-- Quiz Display -->
<div class="module" id="quiz-display">
  <div class="quiz-wrap">
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-timer-bar-wrap">
      <div class="quiz-timer-bar" id="quizTimerBar" style="width:100%"></div>
    </div>
    <div class="quiz-timer-text" id="quizTimerText"></div>
  </div>
</div>

<!-- Quiz Result -->
<div class="module" id="quiz-result">
  <div class="result-wrap">
    <div class="result-title">答题结果</div>
    <div class="result-answer" id="resultAnswer"></div>
    <div class="result-stats">
      <div class="result-stat">
        <div class="result-stat-value" id="resultTotal">0</div>
        <div class="result-stat-label">TOTAL</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-value" id="resultCorrect">0</div>
        <div class="result-stat-label">CORRECT</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-value" id="resultRatio">0%</div>
        <div class="result-stat-label">RATIO</div>
      </div>
    </div>
    <div class="result-explanation" id="resultExplanation"></div>
  </div>
</div>

<!-- Danmaku Wall -->
<div class="module" id="danmaku-wall">
  <div class="danmaku-list" id="danmakuList"></div>
</div>

<script>
// ---- WebSocket with auto-reconnect ----
let ws = null, wsTimer = null;
let giftHideTimer = null, scHideTimer = null;
let quizTimerInterval = null, quizTotalTime = 30;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?type=overlay`);
  ws.onopen = () => { clearTimeout(wsTimer); };
  ws.onclose = () => { wsTimer = setTimeout(connect, 3000); };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    try { handleMessage(JSON.parse(e.data)); } catch (_) {}
  };
}

function handleMessage(msg) {
  if (msg.type === 'module_toggle') {
    const p = msg.payload;
    if (p) toggleModule(p.module, p.visible);
  } else if (msg.type === 'live_event') {
    const p = msg.payload;
    if (!p) return;
    const cmd = p.cmd || p.Cmd || '';
    if (cmd === 'DANMU_MSG') appendDanmaku(p);
    if (cmd === 'SEND_GIFT') showGiftAlert(p);
    if (cmd === 'SUPER_CHAT_MESSAGE') showSCAlert(p);
  } else if (msg.type === 'game_state') {
    const p = msg.payload;
    if (!p) return;
    if (p.game === 'quiz') showQuiz(p.state);
    if (p.game === 'quiz_result') showQuizResult(p.state);
    if (p.game === 'vote') updateScoreboard(p.state);
  }
}

function toggleModule(name, visible) {
  const el = document.getElementById(name);
  if (!el) return;
  el.classList.toggle('visible', visible);
}

// ---- Gift Alert ----
function showGiftAlert(p) {
  const user = p.username || p.Username || '';
  const gift = p.gift_name || p.GiftName || '';
  const count = p.count || p.GiftCount || 1;
  const price = p.price || p.Price || 0;
  document.getElementById('giftUser').textContent = user;
  document.getElementById('giftText').textContent = `送出 ${gift} x${count}`;
  document.getElementById('giftPrice').textContent = price > 0 ? `${price}` : '';
  document.getElementById('giftIcon').textContent = getGiftEmoji(gift);
  toggleModule('gift-alert', true);
  clearTimeout(giftHideTimer);
  giftHideTimer = setTimeout(() => toggleModule('gift-alert', false), 4000);
}

function getGiftEmoji(name) {
  const map = { '辣条': '🌶️', '小心心': '💗', '礼物': '🎁', '舰长': '⚓', '提督': '🚢', '总督': '👑' };
  return map[name] || '🎁';
}

// ---- SC Alert ----
function showSCAlert(p) {
  const user = p.username || p.Username || '';
  const text = p.text || p.Text || '';
  const price = p.price || p.Price || 0;
  document.getElementById('scUser').textContent = user;
  document.getElementById('scText').textContent = text;
  document.getElementById('scPrice').textContent = `¥${price}`;
  toggleModule('sc-alert', true);
  clearTimeout(scHideTimer);
  scHideTimer = setTimeout(() => toggleModule('sc-alert', false), 8000);
}

// ---- Scoreboard ----
function updateScoreboard(state) {
  if (!state) return;
  const scores = state.scores || {};
  const slots = state.slots || [];
  const maxScore = Math.max(1, ...Object.values(scores).map(Number));
  const sorted = [...slots].sort((a, b) => (scores[b.id] || 0) - (scores[a.id] || 0));
  const rows = document.getElementById('scoreboardRows');
  rows.innerHTML = sorted.map((slot, i) => {
    const score = scores[slot.id] || 0;
    const pct = Math.round((score / maxScore) * 100);
    return `<div class="sb-row">
      <div class="sb-rank">${i + 1}</div>
      <div class="sb-name">${slot.name}</div>
      <div class="sb-bar-wrap"><div class="sb-bar" style="width:${pct}%"></div></div>
      <div class="sb-score">${score}</div>
    </div>`;
  }).join('');
  if (state.active) toggleModule('scoreboard', true);
}

// ---- Quiz Display ----
const LABELS = ['A', 'B', 'C', 'D'];
function showQuiz(state) {
  if (!state) return;
  document.getElementById('quizQuestion').textContent = state.question || '';
  const opts = state.options || [];
  document.getElementById('quizOptions').innerHTML = opts.map((opt, i) =>
    `<div class="quiz-option">
      <div class="quiz-option-label">${LABELS[i]}</div>
      <span>${opt}</span>
    </div>`
  ).join('');
  quizTotalTime = state.timeout || 30;
  startTimerBar(quizTotalTime);
  toggleModule('quiz-display', true);
  toggleModule('quiz-result', false);
}

function startTimerBar(seconds) {
  clearInterval(quizTimerInterval);
  let left = seconds;
  const bar = document.getElementById('quizTimerBar');
  const text = document.getElementById('quizTimerText');
  bar.style.transition = 'none';
  bar.style.width = '100%';
  quizTimerInterval = setInterval(() => {
    left--;
    const pct = Math.max(0, (left / seconds) * 100);
    bar.style.transition = 'width 1s linear';
    bar.style.width = pct + '%';
    text.textContent = `${left}s`;
    if (left <= 0) clearInterval(quizTimerInterval);
  }, 1000);
}

// ---- Quiz Result ----
function showQuizResult(state) {
  if (!state) return;
  clearInterval(quizTimerInterval);
  const opts = state.options || [];
  const answerIdx = state.answer || 0;
  const answerText = opts[answerIdx] ? `${LABELS[answerIdx]}. ${opts[answerIdx]}` : '';
  document.getElementById('resultAnswer').textContent = `正确答案: ${answerText}`;
  document.getElementById('resultTotal').textContent = state.total_answers || 0;
  document.getElementById('resultCorrect').textContent = state.correct_count || 0;
  document.getElementById('resultRatio').textContent = ((state.correct_ratio || 0) * 100).toFixed(1) + '%';
  document.getElementById('resultExplanation').textContent = state.explanation || '';
  toggleModule('quiz-display', false);
  toggleModule('quiz-result', true);
  setTimeout(() => toggleModule('quiz-result', false), 10000);
}

// ---- Danmaku Wall ----
const MAX_DANMAKU = 20;
function appendDanmaku(p) {
  const user = p.username || p.Username || '';
  const text = p.text || p.Text || '';
  if (!text) return;
  const list = document.getElementById('danmakuList');
  const item = document.createElement('div');
  item.className = 'danmaku-item';
  item.innerHTML = `<span class="dm-user">${escHtml(user)}</span>${escHtml(text)}`;
  list.insertBefore(item, list.firstChild);
  while (list.children.length > MAX_DANMAKU) list.removeChild(list.lastChild);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- Init ----
connect();
toggleModule('danmaku-wall', true);
</script>
</body>
</html>
